# Standalone: deliberately NOT a member of the root workspace, so that no
# `ada-url` dev-dependency ever reaches the `url` crate's own manifest.
[workspace]

[package]
name = "url-ada-comparison"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
url = { path = "../../url" }
ada-url = "=4.0.0"

[dev-dependencies]
criterion = "0.5"

[[bench]]
name = "compare"
harness = false

# Same codegen settings on both sides, so neither parser is measured with an
# advantage the other did not get.
[profile.release]
lto = true
codegen-units = 1
